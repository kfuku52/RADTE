name: Create major/minor release from RADTE version

on:
  workflow_run:
    workflows: [RADTE ci]
    types: [completed]

jobs:
  create-release:
    permissions:
      contents: write
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read and classify version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -nE "s/^radte_version[[:space:]]*=[[:space:]]*'([0-9]+\.[0-9]+\.[0-9]+)'[[:space:]]*$/\1/p" R/version.R)
          if [[ ! "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Expected one semantic radte_version assignment in R/version.R, got: $VERSION"
            exit 1
          fi

          SHOULD_RELEASE=false
          if (( 10#${BASH_REMATCH[3]} == 0 )); then
            SHOULD_RELEASE=true
          fi

          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "should_release=$SHOULD_RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Skip patch-only version
        if: steps.version.outputs.should_release != 'true'
        run: echo "${{ steps.version.outputs.version }} is a patch-only version; no tag or GitHub Release will be created."

      - name: Create annotated tag
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          EXPECTED=$(git rev-parse HEAD)
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            ACTUAL=$(git rev-list -n 1 "$TAG")
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "Tag $TAG already points to $ACTUAL, expected $EXPECTED."
              exit 1
            fi
            echo "Tag $TAG already points to the tested commit."
          else
            TAG_OBJECT=$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
              --method POST \
              -f tag="$TAG" \
              -f message="$TAG" \
              -f object="$EXPECTED" \
              -f type=commit \
              --jq .sha)
            gh api "repos/$GITHUB_REPOSITORY/git/refs" \
              --method POST \
              -f ref="refs/tags/$TAG" \
              -f sha="$TAG_OBJECT" >/dev/null
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          fi
