name: RADTE ci

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '17 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

env:
  CRAN_REPO: https://cloud.r-project.org

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.r-lib/4.6
      RADTE_INSTALL_DEV: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up R 4.6
        uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          r-version: '4.6'

      - name: Restore R package cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ github.workspace }}/.r-lib
          key: r-quality-${{ runner.os }}-4.6-${{ hashFiles('DESCRIPTION', 'test/install_dependencies.R') }}
          restore-keys: r-quality-${{ runner.os }}-4.6-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev libuv1-dev

      - name: Install R dependencies
        run: Rscript test/install_dependencies.R

      - name: Verify generated artifacts and version consistency
        shell: bash
        run: |
          Rscript tools/build_radte.R --check
          Rscript tools/generate_cli_reference.R --check
          if [ -n "$GITHUB_BASE_REF" ]; then
            Rscript tools/check_version.R "--against=origin/$GITHUB_BASE_REF"
          else
            Rscript tools/check_version.R
          fi

      - name: Lint source files
        run: Rscript tools/lint.R

      - name: Check R package metadata
        shell: bash
        run: |
          PACKAGE_CHECK_DIR=$(mktemp -d)
          cd "$PACKAGE_CHECK_DIR"
          R CMD build "$GITHUB_WORKSPACE" --no-build-vignettes --no-manual
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check RADTE_*.tar.gz --no-manual --no-build-vignettes

      - name: Run fast tests
        env:
          RADTE_TEST_PROFILE: fast
        run: Rscript test/run_tests.R

      - name: Generate coverage report
        run: Rscript tools/coverage.R

      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-r-4.6
          path: |
            coverage.xml
            coverage-summary.txt

  integration-current:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.r-lib/4.6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up R 4.6
        uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          r-version: '4.6'

      - name: Restore R package cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ github.workspace }}/.r-lib
          key: r-integration-${{ runner.os }}-4.6-${{ hashFiles('DESCRIPTION', 'test/install_dependencies.R') }}
          restore-keys: r-integration-${{ runner.os }}-4.6-

      - name: Install system and PAML dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libuv1-dev paml
          command -v mcmctree

      - name: Install R dependencies
        run: Rscript test/install_dependencies.R

      - name: Run full tests with PAML
        env:
          RADTE_TEST_PROFILE: full
          RADTE_RUN_PAML_TESTS: 'true'
        run: Rscript test/run_tests.R

  compatibility:
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    env:
      R_LIBS_USER: ${{ github.workspace }}/.r-lib/${{ matrix.r-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r-version: '4.3'
            run-paml: 'false'
          - os: ubuntu-latest
            r-version: '4.4'
            run-paml: 'false'
          - os: ubuntu-latest
            r-version: '4.5'
            run-paml: 'false'
          - os: ubuntu-latest
            r-version: '4.6'
            run-paml: 'true'
          - os: macos-latest
            r-version: '4.6'
            run-paml: 'false'
          - os: windows-latest
            r-version: '4.6'
            run-paml: 'false'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          r-version: ${{ matrix.r-version }}

      - name: Restore R package cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ github.workspace }}/.r-lib
          key: r-compat-${{ runner.os }}-${{ matrix.r-version }}-${{ hashFiles('DESCRIPTION', 'test/install_dependencies.R') }}
          restore-keys: r-compat-${{ runner.os }}-${{ matrix.r-version }}-

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libuv1-dev

      - name: Install PAML
        if: matrix.run-paml == 'true'
        run: |
          sudo apt-get install --no-install-recommends -y paml
          command -v mcmctree

      - name: Install R dependencies
        run: Rscript test/install_dependencies.R

      - name: Run full tests
        env:
          RADTE_TEST_PROFILE: full
          RADTE_RUN_PAML_TESTS: ${{ matrix.run-paml }}
        run: Rscript test/run_tests.R
