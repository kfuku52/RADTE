name: RADTE ci

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '17 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

# PRs have a single current run. Release pushes keep their own group so a
# subsequent patch cannot cancel validation needed by tag_from_version.yml.
concurrency:
  group: radte-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CRAN_REPO: https://cloud.r-project.org

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.plan.outputs.code }}
      release: ${{ steps.plan.outputs.release }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          r-version: '4.6'
      - name: Verify generated artifacts and version before dependency installation
        shell: bash
        run: |
          Rscript tools/build_radte.R --check
          Rscript tools/generate_cli_reference.R --check
          if [ -n "$GITHUB_BASE_REF" ]; then
            Rscript tools/check_version.R "--against=origin/$GITHUB_BASE_REF"
          else
            Rscript tools/check_version.R
          fi
      - name: Select validation lanes
        id: plan
        env:
          RADTE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: Rscript tools/ci_plan.R

  quality:
    needs: preflight
    if: needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: radte-quality-${{ github.ref }}-${{ needs.preflight.outputs.release == 'true' && github.sha || 'development' }}
      cancel-in-progress: ${{ needs.preflight.outputs.release != 'true' }}
    env:
      RADTE_INSTALL_DEV: 'true'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          r-version: '4.6'
      - id: cache-key
        run: Rscript tools/cache_key.R
      - name: Restore R package cache
        if: github.event_name != 'schedule'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-v2-quality-${{ runner.os }}-${{ runner.arch }}-4.6-${{ steps.cache-key.outputs.dependencies }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev libuv1-dev
      - name: Install R dependencies
        run: Rscript test/install_dependencies.R
      - name: Lint source files
        run: Rscript tools/lint.R
      - name: Check installed R package and its smoke test
        shell: bash
        run: |
          PACKAGE_CHECK_DIR=$(mktemp -d)
          cd "$PACKAGE_CHECK_DIR"
          R CMD build "$GITHUB_WORKSPACE" --no-build-vignettes --no-manual
          _R_CHECK_FORCE_SUGGESTS_=false R CMD check RADTE_*.tar.gz --no-manual --no-build-vignettes
      - name: Run fast tests
        env:
          RADTE_TEST_PROFILE: fast
        run: Rscript test/run_tests.R
      - name: Generate coverage report including numerical and retry tests
        run: Rscript tools/coverage.R
      - name: Upload coverage report
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-r-4.6
          retention-days: 7
          path: |
            coverage.xml
            coverage-summary.txt

  integration-current:
    needs: preflight
    if: github.event_name == 'pull_request' && needs.preflight.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          r-version: '4.6'
      - id: cache-key
        run: Rscript tools/cache_key.R
      - name: Restore R package cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-v2-runtime-${{ runner.os }}-${{ runner.arch }}-4.6-${{ steps.cache-key.outputs.dependencies }}
      - name: Install system and PAML dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libuv1-dev paml
          command -v mcmctree
      - name: Install R dependencies
        run: Rscript test/install_dependencies.R
      - name: Run full tests with PAML
        env:
          RADTE_TEST_PROFILE: full
          RADTE_RUN_PAML_TESTS: 'true'
        run: Rscript test/run_tests.R

  compatibility:
    needs: preflight
    if: github.event_name != 'pull_request' && needs.preflight.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    concurrency:
      group: radte-compat-${{ matrix.os }}-${{ matrix.r }}-${{ github.ref }}-${{ needs.preflight.outputs.release == 'true' && github.sha || 'development' }}
      cancel-in-progress: ${{ needs.preflight.outputs.release != 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          r-version: ${{ matrix.r }}
      - id: cache-key
        run: Rscript tools/cache_key.R
      - name: Restore R package cache
        if: github.event_name != 'schedule'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-v2-runtime-${{ runner.os }}-${{ runner.arch }}-${{ matrix.r }}-${{ steps.cache-key.outputs.dependencies }}
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libuv1-dev
      - name: Install PAML
        if: matrix.paml == 'true'
        run: |
          sudo apt-get install --no-install-recommends -y paml
          command -v mcmctree
      - name: Install R dependencies
        run: Rscript test/install_dependencies.R
      - name: Run full tests
        env:
          RADTE_TEST_PROFILE: full
          RADTE_RUN_PAML_TESTS: ${{ matrix.paml }}
        run: Rscript test/run_tests.R
