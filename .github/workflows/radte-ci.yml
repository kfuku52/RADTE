name: RADTE ci

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-full:
    runs-on: ${{ matrix.os }}
    env:
      CRAN_REPO: https://cloud.r-project.org
      R_LIBS_USER: ${{ github.workspace }}/.r-lib/${{ matrix.r-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r-version: '4.3'
            run-paml: 'false'
          - os: ubuntu-latest
            r-version: '4.4'
            run-paml: 'false'
          - os: ubuntu-latest
            r-version: '4.5'
            run-paml: 'false'
          - os: ubuntu-latest
            r-version: '4.6'
            run-paml: 'true'
          - os: macos-latest
            r-version: '4.6'
            run-paml: 'false'
          - os: windows-latest
            r-version: '4.6'
            run-paml: 'false'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@6f6e5bc62fba3a704f74e7ad7ef7676c5c6a2590 # v2.11.4
        with:
          r-version: ${{ matrix.r-version }}

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libuv1-dev

      - name: Install PAML
        if: matrix.run-paml == 'true'
        run: |
          sudo apt-get install --no-install-recommends -y paml
          command -v mcmctree

      - name: Install R dependencies
        run: Rscript test/install_dependencies.R

      - name: Run full tests
        env:
          RADTE_TEST_PROFILE: full
          RADTE_RUN_PAML_TESTS: ${{ matrix.run-paml }}
        run: Rscript test/run_tests.R
